name: scanny
description: Scanny - vulnerability alerts for your team, grouped by the systems each group manages.
publish_to: 'none'
version: 1.3.2+3

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  # Push notifications (FCM). Messages come from Scanny for Windows.
  firebase_messaging: ^15.1.3
  # Pinned to v6: v7 changed the whole sign-in API.
  google_sign_in: ^6.2.1
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  # Pinned major, same as Dishy: v20+ may change the initialize() API.
  flutter_local_notifications: ^19.4.0
  local_auth: ^2.3.0
  crypto: any
  # Export per group (CSV and PDF, written by lib/logic/pdf_lite.dart: no pdf/image/archive packages) and sharing.
  share_plus: ^13.3.1
  path_provider: ^2.1.5
  # LOCAL COPY (packages/home_widget = home_widget 0.9.4): only its android/build.gradle is changed. See packages/SCANNY-PATCH.md.
  home_widget:
    path: packages/home_widget

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
  fonts:
    # IBM Plex Sans Arabic (SIL Open Font License, see assets/fonts/OFL.txt): Arabic and Latin in one family,
    # so comments written in Arabic show correctly.
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
